[project]
name = "living-people-map"
version = "0.1.0"
description = "A semantic map of the most famous living people, built from English Wikipedia"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "cohere>=7.0.5",
    "umap-learn>=0.5.10",
    "datamapplot>=0.5",
    "toponymy>=0.5,<0.6",
    "evoc>=0.1.3",
    "fast-hdbscan==0.2.2",
    "glasbey>=0.3.0",
    "nest-asyncio>=1.6.0",
    "transformers>=4.40",
    "anthropic>=0.116.0",
    "concept-erasure>=0.2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "plotly>=6.8.0",
]

# datamapplot is pinned past PyPI's 0.7.3 (2026-05-31) for two post-release
# merges we depend on:
#   #206 tap-to-inspect -- stage 08 sets on_click, so before this a phone tap
#        jumped straight to Wikipedia and the hover card was unreachable.
#   #197 scroll_zoom_speed -- MAP_SCROLL_ZOOM_SPEED in config.
# The rev is main's HEAD as of 2026-08-04, which IS the #206 merge commit, so
# it carries those two plus #198 (font-fetch SSRF fix), #199 (empty-label
# normalization -- a no-op here; our unlabelled rows are the literal
# "Unlabelled"), and #204 (density overview during selections). NOTE: main
# still self-reports version "0.7.3", so the installed build is
# indistinguishable from the release by version string -- trust this rev, not
# datamapplot.__version__. Drop back to PyPI once 0.7.4 ships with these.
[tool.uv.sources]
datamapplot = { git = "https://github.com/TutteInstitute/datamapplot", rev = "5cf47aa5ecc2023dde89226fff93f67513341cf5" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "util"]

[tool.pytest.ini_options]
testpaths = ["tests"]
